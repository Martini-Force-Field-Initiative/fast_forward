
name: run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
      runs-on: ubuntu-latest

      strategy:
        fail-fast: false
        matrix:
          python-version: ['3.11', '3.12', '3.13']

      steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
      - name: Install dependencies
        # editable install: fast_forward.tests is excluded from the built package,
        # and the integration tests read their data from examples/ in the checkout
        run: |
          pip install --upgrade setuptools pip
          pip install --upgrade -e .
          pip install --group tests

      - name: Run tests
        run: |
          pytest -v --cov=fast_forward --cov-report=term fast_forward/tests
